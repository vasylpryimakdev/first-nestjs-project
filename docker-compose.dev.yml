name: taskflow_dev

services:
  postgres:
    image: postgres:17

    container_name: taskflow_postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: Dockerfile

    image: taskflow-api:dev

    container_name: taskflow_migration

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    command: npm run migration:run

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: taskflow-api:dev

    container_name: taskflow_api

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    ports:
      - '3000:3000'

    depends_on:
      migration:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data:
