name: taskflow_dev

services:
  postgres:
    image: postgres:17

    container_name: taskflow_postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  test-db:
    image: postgres:17

    profiles:
      - with-test-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_e2e

    ports:
      - '127.0.0.1:5433:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

    restart: 'no'

  migration:
    build: .

    image: ${APP_IMAGE:-taskflow-api:dev}

    container_name: taskflow_migration

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    command: npm run migration:run:prod

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

  api:
    build: .

    image: ${APP_IMAGE:-taskflow-api:dev}

    container_name: taskflow_api

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data:
