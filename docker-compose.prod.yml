name: taskflow_prod

services:
  migration:
    image: ${APP_IMAGE:-taskflow-api:prod}

    container_name: taskflow_migration

    env_file:
      - .env

    command: npm run migration:run:prod

    restart: 'no'

  api:
    image: ${APP_IMAGE:-taskflow-api:prod}

    container_name: taskflow_api

    env_file:
      - .env

    ports:
      - '3000:3000'

    depends_on:
      migration:
        condition: service_completed_successfully

    restart: unless-stopped
