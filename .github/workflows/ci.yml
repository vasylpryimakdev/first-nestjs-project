name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: tasks_e2e
      DB_SYNC: 'true'
      DB_SSL: 'false'
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 1m
      TEST_DB_PORT: 5433

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Write e2e environment file
        run: |
          {
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_SYNC=%s\n' "$DB_SYNC"
            printf 'DB_SSL=%s\n' "$DB_SSL"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
          } > .env

      - name: Start e2e database
        run: docker compose -p taskflow_e2e -f docker-compose.dev.yml --profile with-test-db up -d --wait test-db

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand

      - name: Stop e2e database
        if: always()
        run: docker compose -p taskflow_e2e -f docker-compose.dev.yml --profile with-test-db down --volumes

      - name: Build application
        run: npm run build
