name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Start e2e database
        run: docker compose -p taskflow_e2e -f docker-compose.dev.yml --profile with-test-db up -d --wait test-db

      - name: Run e2e tests
        env:
          TEST_DB_PORT: 5433
        run: npm run test:e2e -- --runInBand

      - name: Stop e2e database
        if: always()
        run: docker compose -p taskflow_e2e -f docker-compose.dev.yml --profile with-test-db down --volumes

      - name: Build application
        run: npm run build
